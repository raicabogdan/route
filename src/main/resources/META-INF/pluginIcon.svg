<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Light mode - Route navigation icon -->
  <defs>
    <linearGradient id="routeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="20" cy="20" r="18" fill="#F1F5F9" opacity="0.8"/>

  <!-- Main route path (less curvy) -->
  <path d="M 5 20 Q 12 16, 20 20 T 35 20"
        stroke="url(#routeGradient)"
        stroke-width="1.5"
        fill="none"
        stroke-linecap="round"/>

  <!-- Text label -->
  <text x="20" y="14" font-family="cursive" font-size="5" font-weight="600" fill="#475569" text-anchor="middle" font-style="italic">Phalcon</text>
  <text x="20" y="29" font-family="cursive" font-size="4" font-weight="400" fill="#2563EB" text-anchor="middle" font-style="italic">route('home')</text>
</svg>
